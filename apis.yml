name: Gameto
description: 'Gameto is a female-led clinical-stage biotechnology company redefining women''s health
  across the reproductive lifespan. Using proprietary induced pluripotent stem cell (iPSC) engineering,
  Gameto develops ovarian cell lines that mimic the biology of the female reproductive system. Its lead
  product, Fertilo, is an engineered line of ovarian support cells that mature immature eggs outside the
  body to reduce the hormonal burden of IVF and egg freezing, and is in a Phase 3 clinical trial (FIRST).
  Additional programs include Deovo, an organoid of the female reproductive system for drug discovery,
  and Ameno, a cell-based therapeutic targeting menopause and primary ovarian insufficiency. Gameto is
  backed by Insight Partners. This is a company profile in the API Evangelist network; Gameto publishes
  no public developer API.'
